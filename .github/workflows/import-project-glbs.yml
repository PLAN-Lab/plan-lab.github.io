name: Import DreamPartGen and SILSA GLBs
on:
  push:
    branches: [codex/glb-galleries-20261010]
    paths:
      - '.github/workflows/import-project-glbs.yml'
permissions:
  contents: write
concurrency:
  group: import-project-glbs
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned asset tools
        run: npm ci --prefix scripts/glb-gallery --no-audit --no-fund
      - name: Download and verify supplied archives
        run: python3 scripts/glb-gallery/download.py "$RUNNER_TEMP/project-glbs"
      - name: Prepare and validate all 34 models
        run: node scripts/glb-gallery/prepare.mjs "$RUNNER_TEMP/project-glbs"
      - name: Commit only the imported gallery assets
        shell: bash
        run: |
          git add assets/data/glb-galleries.json assets/vendor/meshoptimizer projects/dreampartgen/static/models projects/silsa/static/models
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import and validate DreamPartGen and SILSA GLB assets'
          git push origin "HEAD:${GITHUB_REF_NAME}"
